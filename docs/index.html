<style>

<script type="module">
/*
 * A self-contained WebGPU ray tracer. No CDN, models, images or runtime dependencies.
 * Actual secondary rays reflect the procedural ground / atmospheric environment.
 * Beer–Lambert extinction + Henyey–Greenstein single scattering, cube shadow rays,
 * and a world-space high cloud layer produce the light shafts (not a 2D overlay).
 * GPU-budgeted dynamic resolution, reprojected HDR history, edge-aware denoising.
 * Gamma-space FXAA -> FidelityFX FSR 1.0 EASU -> RCAS at fixed output resolution.
 * Open in a WebGPU browser using localhost / HTTPS (file:// works in Chromium too).
 */
const canvas = document.querySelector('#scene');
const inputs = [...document.querySelectorAll('input')];
const controls = Object.fromEntries(inputs.map(input=>[input.id,input]));
const sunDiscToggle = document.querySelector('#sun-disc-toggle');
let sunDiscVisible = true;
const errorBox = document.querySelector('#error');
const fpsOutput = document.querySelector('#fps');
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const orbit = { yaw:0.70, pitch:0.29, radius:10.8 };
const target = {...orbit};
const CUBE_HALF = 0.91;
const CUBE_EDGE = CUBE_HALF*2;
const BALL_RADIUS = CUBE_EDGE/8; // Diameter is one quarter of the cube edge.
const BALL_SPEED = CUBE_EDGE*1.5;
// The arrow identifies the +Z face; measure four cube edges from that face.
const ball = {x:0, y:BALL_RADIUS, z:CUBE_HALF+4*CUBE_EDGE};
const movementKeys = new Set();
const movementCodes = new Set(['KeyW','KeyA','KeyS','KeyD']);
const pointers = new Map();
let pinchDistance = 0, device, context, format, uniformBuffer, tracePipeline, temporalPipeline, displayPipeline;
let postUniformBuffer, postLayout, fxaaPipeline, easuPipeline, rcasPipeline;
let toneMapped, antiAliased, upscaled, fxaaGroup, easuGroup, rcasGroup;
let history = [], geometry = [], rawRadiance, traceGroup, temporalGroups = [], displayGroups = [];
let frame = 0, totalFrames = 0, completedFrames = 0, pendingFrames = 0;
let renderWidth = 0, renderHeight = 0, scheduled = false, stopped = false;
let outputWidth = 0, outputHeight = 0, resolutionEpoch = 0;
let resizeNeeded = true, dirty = true, initialized = false, historyValid = false, generation = 0;
let noiseTexture, noiseSampler, lastRenderTime = 0, cameraMotion = 0;
let lastInteractionTime = -Infinity;
const uniforms = new Float32Array(80);
const previousUniforms = new Float32Array(80);
const postUniforms = new Float32Array(12);
const quality = {targetFps:60, minScale:0.5, maxScale:1, scale:0.7, averageMs:0, warmup:8, slow:0, fast:0, lastChange:0, changes:0, awaitingAdjustment:false};
const gpuTimer = {enabled:false, slots:[]};
const diagnostics = {backend:'WebGPU', ready:false, frames:0, samples:0, error:null, resolution:[0,0], outputResolution:[0,0], renderScale:1, targetFps:quality.targetFps, milliseconds:0, gpuMilliseconds:0, budgetMilliseconds:0, timingSource:'queue-latency', fps:0, resolutionChanges:0, passes:['Trace','Temporal','Denoise / Tone Map','FXAA 3.11','FSR 1.0 EASU','FSR 1.0 RCAS'], adapterAttempts:[]};
// A read-only diagnostics handle for testing; it adds no interface elements.
Object.defineProperty(window,'sceneDiagnostics',{get:()=>({...diagnostics, camera:{...orbit,focus:{...ball}}, ball:{...ball,radius:BALL_RADIUS}, movementKeys:[...movementKeys], controls:inputs.map(i=>Number(i.value)), controlValues:Object.fromEntries(inputs.map(i=>[i.id,Number(i.value)])), sunDiscVisible})});

const shader = /* wgsl */`
struct Uniforms {
  screen: vec4f,       // width, height, accumulated samples, random sequence
  eye: vec4f,
  forward: vec4f,
  right: vec4f,
  up: vec4f,
  sun: vec4f,          // direction, radiance
  atmosphere: vec4f,   // extinction, valid history, camera motion, sun disc visibility
  previousEye: vec4f,
  previousForward: vec4f,
  previousRight: vec4f,
  previousUp: vec4f,
  jitter: vec4f,       // current pixel offset xy, previous pixel offset zw
  fogColor: vec4f,     // luminance-normalized atmospheric tint, reserved
  fogSettings: vec4f,  // fog saturation, fog brightness, shaft size, gap coverage
  lightColor: vec4f,   // direct sunlight RGB, W visible sun disc size
  skyHorizon: vec4f, // RGB sky tint, W ground boundary distance
  skyZenith: vec4f,
  shaftSettings: vec4f, // directional scattering opacity, reserved yzw
  ball: vec4f,         // sphere center xyz and radius
  previousBall: vec4f,
}
@group(0) @binding(0) var<uniform> u: Uniforms;
@group(0) @binding(1) var noiseLattice: texture_2d<f32>;
@group(0) @binding(2) var noiseSampler: sampler;
const PI = 3.14159265359;
const FAR = 1000000.0;
const CENTER = vec3f(0.0, 0.91, 0.0);
const HALF = vec3f(0.91);
const BEVEL = 0.048;
var<private> rng: u32;

fn random() -> f32 {
  rng = rng * 747796405u + 2891336453u;
  let word = ((rng >> ((rng >> 28u) + 4u)) ^ rng) * 277803737u;
  return f32((word >> 22u) ^ word) / 4294967296.0;
}
fn noise(p: vec2f) -> f32 {
  let i = floor(p); let f = fract(p); let s = f*f*(3.0-2.0*f);
  return textureSampleLevel(noiseLattice,noiseSampler,(i+s+128.5)/256.0,0.0).r;
}
fn fbm(p: vec2f) -> f32 {
  return 0.57*noise(p) + 0.28*noise(p*2.03+11.7) + 0.15*noise(p*4.11-8.4);
}
fn boxSDF(p: vec3f) -> f32 {
  let q = abs(p-CENTER) - (HALF-BEVEL);
  return length(max(q,vec3f(0))) + min(max(q.x,max(q.y,q.z)),0.0) - BEVEL;
}
fn bounds(ro: vec3f, rd: vec3f, halfSize: vec3f) -> vec2f {
  // sign(0) is zero; explicitly protect exactly parallel rays.
  let safe = select(vec3f(-1e-7),vec3f(1e-7),rd>=vec3f(0));
  let inv = 1.0 / select(rd,safe,abs(rd)<vec3f(1e-7));
  let a = (CENTER-halfSize-ro)*inv; let b = (CENTER+halfSize-ro)*inv;
  let lo = min(a,b); let hi = max(a,b);
  return vec2f(max(lo.x,max(lo.y,lo.z)),min(hi.x,min(hi.y,hi.z)));
}
fn cubeHit(ro: vec3f, rd: vec3f) -> f32 {
  let slab = bounds(ro,rd,HALF);
  if slab.y < max(slab.x,0.001) { return FAR; }
  var t = max(slab.x,0.001);

  right: vec4f,
  up: vec4f,
  sun: vec4f,
  atmosphere: vec4f,

  previousRight: vec4f,
  previousUp: vec4f,
  jitter: vec4f,

@fragment fn fs(@builtin(position) p: vec4f) -> @location(0) vec4f {
  let size = vec2i(textureDimensions(resolvedHistory));
  let pixel = clamp(vec2i(p.xy), vec2i(0), size - vec2i(1));
  let center = textureLoad(resolvedHistory, pixel, 0);
  let geometry = textureLoad(currentGeometry, pixel, 0);
  let historyLength = max(center.a, 1.0);
  let centerLuma = luminance(center.rgb);
  let colorWidth = 0.045 + abs(centerLuma) * 0.32 + 0.06 / sqrt(historyLength);
  var filtered = vec3f(0.0);
  var weights = 0.0;
  for (var y = -1; y <= 1; y++) {
    for (var x = -1; x <= 1; x++) {
      let coord = clamp(pixel + vec2i(x, y), vec2i(0), size - vec2i(1));
      let g = textureLoad(currentGeometry, coord, 0);
      if (geometry.w < 0.0) != (g.w < 0.0) { continue; }
      var geometryWeight = 1.0;
      if geometry.w >= 0.0 {
        let normalAgreement = max(dot(geometry.xyz, g.xyz), 0.0);
        if normalAgreement < 0.94 { continue; }
        let depthWidth = max(0.04, abs(geometry.w) * 0.018);
        let depthDifference = abs(g.w - geometry.w) / depthWidth;
        if depthDifference > 2.0 { continue; }
        geometryWeight = pow(normalAgreement, 24.0) * exp(-depthDifference * depthDifference);
      }
      let sampleColor = textureLoad(resolvedHistory, coord, 0).rgb;
      let colorDifference = (luminance(sampleColor) - centerLuma) / colorWidth;
      let spatialWeight = select(1.0, 2.0, x == 0) * select(1.0, 2.0, y == 0);
      let weight = spatialWeight * geometryWeight * exp(-colorDifference * colorDifference * 0.5);
      filtered += sampleColor * weight;
      weights += weight;
    }
  }
  // Newly revealed pixels get a stronger spatial cleanup. Converged surfaces
  // keep their brushed-metal and sand detail instead of retaining a blur.
  let baseStrength = clamp(0.95 / sqrt(historyLength), 0.06, 0.88);
  // Once stationary coverage has converged, stop letting the newest jittered
  // material ID change the bilateral neighborhood around a tiny silhouette.
  let strength = baseStrength * select(1.0,1.0-smoothstep(8.0,32.0,historyLength),u.atmosphere.z<0.00001);
  var c = mix(center.rgb, filtered / max(weights, 0.00001), strength);
  let uv = p.xy / u.screen.xy;
  let bloomStep = vec2f(12.0) / u.screen.xy;
  let bloom0 = textureSampleLevel(resolvedHistory, linearSampler, uv + vec2f(bloomStep.x, 0.0), 0.0).rgb;
  let bloom1 = textureSampleLevel(resolvedHistory, linearSampler, uv - vec2f(bloomStep.x, 0.0), 0.0).rgb;
  let bloom2 = textureSampleLevel(resolvedHistory, linearSampler, uv + vec2f(0.0, bloomStep.y), 0.0).rgb;
  let bloom3 = textureSampleLevel(resolvedHistory, linearSampler, uv - vec2f(0.0, bloomStep.y), 0.0).rgb;
  let bloom = max(bloom0 - vec3f(0.75), vec3f(0.0)) + max(bloom1 - vec3f(0.75), vec3f(0.0))
    + max(bloom2 - vec3f(0.75), vec3f(0.0)) + max(bloom3 - vec3f(0.75), vec3f(0.0));
  c += bloom * 0.015;
  let vignette = (uv - vec2f(0.5)) * vec2f(1.0, 0.75);
  c *= 1.0 - 0.15 * dot(vignette, vignette);
  c = aces(c * 1.12);
  c = pow(c, vec3f(1.0 / 2.2));
  return vec4f(clamp(c, vec3f(0.0), vec3f(1.0)), 1.0);
}
`;

struct PostUniforms {
  renderSize: vec4f,
  outputSize: vec4f,
  settings: vec4f,
};
@group(0) @binding(0) var<uniform> u: PostUniforms;
@group(0) @binding(1) var source: texture_2d<f32>;
@group(0) @binding(2) var linearSampler: sampler;

@vertex fn vs(@builtin(vertex_index) id: u32) -> @builtin(position) vec4f {
  let p = vec2f(f32((id << 1u) & 2u), f32(id & 2u));
  return vec4f(p * vec2f(2.0, -2.0) + vec2f(-1.0, 1.0), 0.0, 1.0);
}
fn rgbAt(uv: vec2f) -> vec3f {
  // Explicit LOD makes the edge-dependent early returns valid in WGSL.
  return textureSampleLevel(source, linearSampler, uv, 0.0).rgb;
}
fn luma(rgb: vec3f) -> f32 {
  return dot(rgb, vec3f(0.299, 0.587, 0.114));
}
fn lumaAt(uv: vec2f) -> f32 { return luma(rgbAt(uv)); }

@fragment fn fs(@builtin(position) pixel: vec4f) -> @location(0) vec4f {
  let texel = 1.0 / u.renderSize.xy;
  let uv = pixel.xy * texel;
  let rgbM = rgbAt(uv);
  let m = luma(rgbM);
  let n = lumaAt(uv + vec2f(0.0, -texel.y));
  let s = lumaAt(uv + vec2f(0.0, texel.y));
  let w = lumaAt(uv + vec2f(-texel.x, 0.0));
  let e = lumaAt(uv + vec2f(texel.x, 0.0));
  let lo = min(m, min(min(n, s), min(w, e)));
  let hi = max(m, max(max(n, s), max(w, e)));
  let contrast = hi - lo;
  // Preserve low-contrast sand detail and skip most sky/fog pixels.
  if (contrast < max(0.0625, hi * 0.166)) { return vec4f(rgbM, 1.0); }

  let nw = lumaAt(uv + vec2f(-texel.x, -texel.y));
  let ne = lumaAt(uv + vec2f(texel.x, -texel.y));
  let sw = lumaAt(uv + vec2f(-texel.x, texel.y));
  let se = lumaAt(uv + vec2f(texel.x, texel.y));
  let edgeH = 2.0 * abs(n + s - 2.0 * m)
            + abs(nw + sw - 2.0 * w) + abs(ne + se - 2.0 * e);
  let edgeV = 2.0 * abs(w + e - 2.0 * m)
            + abs(nw + ne - 2.0 * n) + abs(sw + se - 2.0 * s);
  let horizontal = edgeH >= edgeV;
  let neighborN = select(w, n, horizontal);
  let neighborP = select(e, s, horizontal);
  let gradientN = neighborN - m;
  let gradientP = neighborP - m;
  let pairN = abs(gradientN) >= abs(gradientP);
  let gradient = max(abs(gradientN), abs(gradientP));
  let pairLuma = (m + select(neighborP, neighborN, pairN)) * 0.5;
  let normal = select(vec2f(texel.x, 0.0), vec2f(0.0, texel.y), horizontal)
             * select(1.0, -1.0, pairN);
  let along = select(vec2f(0.0, texel.y), vec2f(texel.x, 0.0), horizontal);
  let base = uv + normal * 0.5;
  var posN = base - along;
  var posP = base + along;
  var endN = 0.0;
  var endP = 0.0;
  var doneN = false;
  var doneP = false;
  // Preset 12 distances: P0=1, P1=1.5, P2=2, P3=4, P4=12.
  // P4 is the final extrapolation, exactly as in the reference preset.
  let searchSteps = array<f32, 4>(1.5, 2.0, 4.0, 12.0);
  for (var i = 0u; i < 4u; i++) {
    if (!doneN) { endN = lumaAt(posN) - pairLuma; }
    if (!doneP) { endP = lumaAt(posP) - pairLuma; }
    doneN = abs(endN) >= gradient * 0.25;
    doneP = abs(endP) >= gradient * 0.25;
    if (doneN && doneP) { break; }
    if (!doneN) { posN -= along * searchSteps[i]; }
    if (!doneP) { posP += along * searchSteps[i]; }
  }
  let distN = select(uv.y - posN.y, uv.x - posN.x, horizontal);
  let distP = select(posP.y - uv.y, posP.x - uv.x, horizontal);
  let nearestEnd = select(endP, endN, distN < distP);
  let goodSpan = (nearestEnd < 0.0) != (m - pairLuma < 0.0);
  let edgeOffset = select(0.0, 0.5 - min(distN, distP) / (distN + distP), goodSpan);
  let average = (2.0 * (n + s + w + e) + nw + ne + sw + se) / 12.0;
  let subpix = clamp(abs(average - m) / contrast, 0.0, 1.0);
  let subpixSmooth = subpix * subpix * (3.0 - 2.0 * subpix);
  let subpixOffset = subpixSmooth * subpixSmooth * 0.5;
  return vec4f(rgbAt(uv + normal * max(edgeOffset, subpixOffset)), 1.0);
}
`;

const fsrShader = /* wgsl */`
struct PostUniforms {
  renderSize: vec4f,
  outputSize: vec4f,
  settings: vec4f,
};
@group(0) @binding(0) var<uniform> u: PostUniforms;
@group(0) @binding(1) var source: texture_2d<f32>;
@group(0) @binding(2) var linearSampler: sampler;

@vertex fn vs(@builtin(vertex_index) id: u32) -> @builtin(position) vec4f {
  let p = vec2f(f32((id << 1u) & 2u), f32(id & 2u));
  return vec4f(p * 2.0 - 1.0, 0.0, 1.0);
}
fn fsrLoad(p: vec2i) -> vec3f {
  let hi = vec2i(textureDimensions(source)) - vec2i(1);
  return textureLoad(source, clamp(p, vec2i(0), hi), 0).rgb;
}
fn fsrLuma(c: vec3f) -> f32 {
  return c.g + 0.5 * (c.r + c.b);
}
// FsrEasuSetF: direction.xy and edge length.z, bilinearly weighted.
fn easuSet(w: f32, a: f32, b: f32, c: f32, d: f32, e: f32) -> vec3f {
  let dir = vec2f(d - b, e - a);
  let span = max(abs(vec2f(d, e) - c), abs(c - vec2f(b, a)));
  let len = clamp(abs(dir) / max(span, vec2f(1e-6)), vec2f(0.0), vec2f(1.0));
  return vec3f(dir, dot(len, len)) * w;
}
// FsrEasuTapF: Lanczos2 approximation rotated/stretched along the edge.
fn easuTap(off: vec2f, dir: vec2f, len: vec2f, lob: f32, clp: f32, color: vec3f) -> vec4f {
  let v = vec2f(dot(off, dir), dot(off, vec2f(-dir.y, dir.x))) * len;
  let d2 = min(dot(v, v), clp);
  let base = 0.4 * d2 - 1.0;
  let window = lob * d2 - 1.0;
  let weight = (1.5625 * base * base - 0.5625) * window * window;
  return vec4f(color * weight, weight);
}
@fragment fn easu(@builtin(position) frag: vec4f) -> @location(0) vec4f {
  // Equal-resolution EASU is a direct copy; RCAS remains available afterward.
  if (all(u.renderSize.xy == u.outputSize.xy)) {
    return vec4f(fsrLoad(vec2i(frag.xy)), 1.0);
  }
  let pp = frag.xy * (u.renderSize.xy / u.outputSize.xy) - vec2f(0.5);
  let origin = vec2i(floor(pp));
  let p = fract(pp);
  // The twelve input texels, centered on f:
  //     b c
  //   e f g h
  //   i j k l
  //     n o
  let b = fsrLoad(origin + vec2i( 0,-1));
  let c = fsrLoad(origin + vec2i( 1,-1));
  let e = fsrLoad(origin + vec2i(-1, 0));
  let f = fsrLoad(origin + vec2i( 0, 0));
  let g = fsrLoad(origin + vec2i( 1, 0));
  let h = fsrLoad(origin + vec2i( 2, 0));
  let i = fsrLoad(origin + vec2i(-1, 1));
  let j = fsrLoad(origin + vec2i( 0, 1));
  let k = fsrLoad(origin + vec2i( 1, 1));
  let l = fsrLoad(origin + vec2i( 2, 1));
  let n = fsrLoad(origin + vec2i( 0, 2));
  let o = fsrLoad(origin + vec2i( 1, 2));
  let bL = fsrLuma(b); let cL = fsrLuma(c);
  let eL = fsrLuma(e); let fL = fsrLuma(f); let gL = fsrLuma(g); let hL = fsrLuma(h);
  let iL = fsrLuma(i); let jL = fsrLuma(j); let kL = fsrLuma(k); let lL = fsrLuma(l);
  let nL = fsrLuma(n); let oL = fsrLuma(o);
  let edge = easuSet((1.0-p.x)*(1.0-p.y), bL,eL,fL,gL,jL)
           + easuSet(p.x*(1.0-p.y), cL,fL,gL,hL,kL)
           + easuSet((1.0-p.x)*p.y, fL,iL,jL,kL,nL)
           + easuSet(p.x*p.y, gL,jL,kL,lL,oL);
  let dirSq = dot(edge.xy, edge.xy);
  var dir = vec2f(1.0, 0.0);
  if (dirSq >= 1.0/32768.0) { dir = edge.xy * inverseSqrt(dirSq); }
  let edgeLength = 0.25 * edge.z * edge.z;
  let stretch = dot(dir, dir) / max(abs(dir.x), abs(dir.y));
  let len = vec2f(1.0 + (stretch - 1.0) * edgeLength, 1.0 - 0.5 * edgeLength);
  let lob = 0.5 - 0.29 * edgeLength;
  let clp = 1.0 / lob;
  var sum = easuTap(vec2f( 0,-1)-p,dir,len,lob,clp,b);
  sum += easuTap(vec2f( 1,-1)-p,dir,len,lob,clp,c);
  sum += easuTap(vec2f(-1, 1)-p,dir,len,lob,clp,i);
  sum += easuTap(vec2f( 0, 1)-p,dir,len,lob,clp,j);
  sum += easuTap(vec2f( 0, 0)-p,dir,len,lob,clp,f);
  sum += easuTap(vec2f(-1, 0)-p,dir,len,lob,clp,e);
  sum += easuTap(vec2f( 1, 1)-p,dir,len,lob,clp,k);
  sum += easuTap(vec2f( 2, 1)-p,dir,len,lob,clp,l);
  sum += easuTap(vec2f( 2, 0)-p,dir,len,lob,clp,h);
  sum += easuTap(vec2f( 1, 0)-p,dir,len,lob,clp,g);
  sum += easuTap(vec2f( 1, 2)-p,dir,len,lob,clp,o);
  sum += easuTap(vec2f( 0, 2)-p,dir,len,lob,clp,n);
  let min4 = min(min(f,g),min(j,k));
  let max4 = max(max(f,g),max(j,k));
  return vec4f(clamp(sum.rgb / max(sum.a, 1e-6), min4, max4), 1.0);
}
@fragment fn rcas(@builtin(position) frag: vec4f) -> @location(0) vec4f {
  let p = vec2i(frag.xy);
  let b = fsrLoad(p + vec2i(0,-1));
  let d = fsrLoad(p + vec2i(-1,0));
  let e = fsrLoad(p);
  let f = fsrLoad(p + vec2i(1,0));
  let h = fsrLoad(p + vec2i(0,1));
  let mn4 = min(min(b,d),min(f,h));
  let mx4 = max(max(b,d),max(f,h));
  // Epsilon guards keep constant black/white neighborhoods finite.
  let hitMin = min(mn4,e) / max(4.0 * mx4, vec3f(1e-6));
  let hitMax = (vec3f(1.0) - max(mx4,e)) / min(4.0 * mn4 - vec3f(4.0), vec3f(-1e-6));
  let channelLobe = max(-hitMin, hitMax);
  var lobe = max(-0.1875, min(max(channelLobe.r,max(channelLobe.g,channelLobe.b)),0.0));
  lobe *= exp2(-max(u.settings.x, 0.0));
  // Official FSR_RCAS_DENOISE modulation: reduce isolated noise sharpening.
  let bL = fsrLuma(b); let dL = fsrLuma(d); let eL = fsrLuma(e);
  let fL = fsrLuma(f); let hL = fsrLuma(h);
  let minL = min(eL,min(min(bL,dL),min(fL,hL)));
  let maxL = max(eL,max(max(bL,dL),max(fL,hL)));
  let noise = clamp(abs(0.25*(bL+dL+fL+hL)-eL) / max(maxL-minL,1e-6),0.0,1.0);
  lobe *= 1.0 - 0.5 * noise;
  let color = (e + lobe * (b+d+f+h)) / (1.0 + 4.0*lobe);
  return vec4f(clamp(color,vec3f(0.0),vec3f(1.0)),1.0);
}`;


function fail(error) {
  stopped=true;
  fpsOutput.textContent='— FPS';
  diagnostics.error=String(error?.message||error);
  console.error(error);
  document.querySelector('.controls').hidden=true;
  document.querySelector('.controls').style.display='none';
  errorBox.textContent=String(error?.message||error);
  errorBox.style.display='grid';
}
function scheduleRender() {
  if(!scheduled&&!stopped&&initialized&&!document.hidden) {scheduled=true;requestAnimationFrame(render);}
}
function invalidate(resetHistory=false,interaction=true) {
  if(interaction)lastInteractionTime=performance.now();
  if(resetHistory)dirty=true;
  frame=0;
  scheduleRender();
}
function updateSlider(input) {
  const value=Number(input.value);
  const displayValue=`${value.toFixed(1)}${input.dataset.unit??'%'}`;
  const fill=(value-Number(input.min))/(Number(input.max)-Number(input.min))*100;
  input.style.setProperty('--fill',`${clamp(fill,0,100)}%`);
  document.getElementById(`${input.id}-value`).value=displayValue;
  input.setAttribute('aria-valuetext',displayValue);
}
for(const input of inputs) {
  updateSlider(input);
  input.addEventListener('input',()=>{ updateSlider(input); invalidate(true); });
}
function resetSliders(sliders) {
  for(const input of sliders) {
    input.value=input.defaultValue;
    updateSlider(input);
  }
  invalidate(true);
}
for(const button of document.querySelectorAll('[data-reset]')) {
  button.addEventListener('click',()=>resetSliders([controls[button.dataset.reset]]));
}
document.querySelector('#reset-all').addEventListener('click',()=>resetSliders(inputs));
const groups = [...document.querySelectorAll('.control-group')];
const toggleGroupsButton = document.querySelector('#toggle-groups');
function syncGroupToggle() {
  const anyOpen = groups.some(group => group.open);
  toggleGroupsButton.textContent = anyOpen ? 'Collapse All' : 'Expand All';
  toggleGroupsButton.setAttribute('aria-label', anyOpen ? 'Collapse All Control Groups' : 'Expand All Control Groups');
  toggleGroupsButton.setAttribute('aria-expanded', String(anyOpen));
}
toggleGroupsButton.addEventListener('click', () => {
  const open = !groups.some(group => group.open);
  for (const group of groups) group.open = open;
  syncGroupToggle();
});
for (const group of groups) group.addEventListener('toggle', syncGroupToggle);
syncGroupToggle();

sunDiscToggle.addEventListener('click',()=>{
  sunDiscVisible=!sunDiscVisible;
  sunDiscToggle.setAttribute('aria-pressed',String(sunDiscVisible));
  sunDiscToggle.title=sunDiscVisible?'Hide Sun Disc':'Show Sun Disc';
  invalidate(true);
});
function updateBall(dt) {
  const forward=Number(movementKeys.has('KeyW'))-Number(movementKeys.has('KeyS'));
  const strafe=Number(movementKeys.has('KeyD'))-Number(movementKeys.has('KeyA'));
  const length=Math.hypot(forward,strafe);
  if(length===0)return 0;
  // Movement follows the current camera's horizontal axes; diagonals have the
  // same speed as a single key. Small steps and axis separation allow sliding.
  const s=Math.sin(orbit.yaw),c=Math.cos(orbit.yaw);
  const distance=BALL_SPEED*dt/length;
  const dx=(c*strafe-s*forward)*distance;
  const dz=(-s*strafe-c*forward)*distance;
  const startX=ball.x,startZ=ball.z;
  const steps=Math.max(1,Math.ceil(BALL_SPEED*dt/(BALL_RADIUS*0.5)));
  const boundary=CUBE_HALF+BALL_RADIUS+0.002;
  for(let i=0;i<steps;i++) {
    let nextX=ball.x+dx/steps;
    if(Math.abs(ball.z)<boundary&&Math.abs(nextX)<boundary) {
      nextX=ball.x>=boundary?boundary:ball.x<=-boundary?-boundary:ball.x;
    }
    ball.x=nextX;
    let nextZ=ball.z+dz/steps;
    if(Math.abs(ball.x)<boundary&&Math.abs(nextZ)<boundary) {
      nextZ=ball.z>=boundary?boundary:ball.z<=-boundary?-boundary:ball.z;
    }
    ball.z=nextZ;
  }
  return Math.hypot(ball.x-startX,ball.z-startZ);
}
function clearMovement() {
  if(movementKeys.size){movementKeys.clear();invalidate();}
}
window.addEventListener('keydown',e=>{
  if(!movementCodes.has(e.code)||e.isComposing||e.ctrlKey||e.altKey||e.metaKey)return;
  const element=e.target;
  if(element?.isContentEditable||element?.closest?.('[contenteditable="true"],textarea,select')||
    (element?.tagName==='INPUT'&&element.type!=='range'))return;
  e.preventDefault();
  if(movementKeys.has(e.code))return;
  if(movementKeys.size===0)lastRenderTime=performance.now();
  movementKeys.add(e.code);
  invalidate();
});
window.addEventListener('keyup',e=>{
  // Always release a key, even when focus or modifier state has changed.
  if(movementKeys.delete(e.code)){e.preventDefault();invalidate();}
});
window.addEventListener('blur',clearMovement);
canvas.addEventListener('pointerdown',e=>{
  canvas.focus({preventScroll:true});

  })));
  // Explicit shared layout: EASU/RCAS use textureLoad, so auto layout would
  // otherwise omit their sampler and disagree with the common bind groups.
  postLayout=device.createBindGroupLayout({entries:[
    {binding:0,visibility:GPUShaderStage.FRAGMENT,buffer:{type:'uniform',minBindingSize:48}},
    {binding:1,visibility:GPUShaderStage.FRAGMENT,texture:{sampleType:'float',viewDimension:'2d'}},
    {binding:2,visibility:GPUShaderStage.FRAGMENT,sampler:{type:'filtering'}}
  ]});
  const postPipelineLayout=device.createPipelineLayout({bindGroupLayouts:[postLayout]});
  [fxaaPipeline,easuPipeline,rcasPipeline]=await Promise.all([
    {module:modules[3],entryPoint:'fs',target:'rgba8unorm'},
    {module:modules[4],entryPoint:'easu',target:'rgba8unorm'},
    {module:modules[4],entryPoint:'rcas',target:format}
  ].map(({module,entryPoint,target})=>device.createRenderPipelineAsync({
    layout:postPipelineLayout,vertex:{module,entryPoint:'vs'},
    fragment:{module,entryPoint,targets:[{format:target}]},primitive:{topology:'triangle-list'}
  })));
  createGpuTimer();
  createNoiseResources();
  initialized=true;
  invalidate();
}
init().catch(fail);
</script>
</body>
